<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102544">
<meta name="description" content="레이싱 퀴즈로 알아보는 CAE 전문기업 태성에스엔이. 참여만 해도 선물을 드려요!">
<title>태성에스엔이 레이싱 퀴즈 · 달리는 정답을 잡아라!</title>
<style>
:root{--navy:#102544;--navy2:#0b1c34;--blue:#1756c5;--gold:#f4b82e;--ink:#192d47;--muted:#5d6d82;--line:#dce4ed;--bg:#f1f4f8;--soft:#eef4ff;--ok:#16834f;--okbg:#e9f7ef;--no:#c8452f;--nobg:#fdeeea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.65;word-break:keep-all}
button,a{font:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
h1:focus,h2:focus{outline:none}
p{margin:0 0 14px}
.shell{max-width:560px;margin:auto;padding:18px 14px 28px}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px}
.brand img{width:44px;height:auto}
.brand strong{display:block;font-size:17px;letter-spacing:-.5px;line-height:1.3}
.brand small{display:block;font-size:9px;font-weight:700;letter-spacing:1px;color:var(--muted)}
.hud{font-size:12px;font-weight:800;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 11px;white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 14px 45px #10254410}
.hero{background:linear-gradient(135deg,#14305a,var(--navy2));color:#fff;padding:30px 24px 28px;text-align:center;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;border:40px solid #ffffff08;right:-90px;top:-110px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--gold);margin:0 0 10px}
.hero h1{font-size:clamp(28px,7.5vw,36px);line-height:1.35;letter-spacing:-1.2px;margin:0 0 12px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{color:#c5d3e7;font-size:14px;margin:0}
.gift-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0 0;position:relative;z-index:1}
.gift-strip div{background:#ffffff10;border:1px solid #ffffff22;border-radius:12px;padding:11px 8px;font-size:12px;color:#dce7f7;line-height:1.5}
.gift-strip b{display:block;color:#fff;font-size:14px;margin-top:2px}
.gift-strip .hot{background:var(--gold);border-color:var(--gold);color:#4a3508}
.gift-strip .hot b{color:var(--navy)}
.body{padding:24px 22px 24px}
.teaser{margin-top:22px;border:1px solid var(--line);border-radius:16px;background:#f7f9fc;overflow:hidden}
.teaser-top{padding:16px 16px 14px}
.teaser-top .k{font-size:11px;font-weight:900;letter-spacing:.8px;color:var(--blue);margin:0 0 6px}
.teaser-top h3{font-size:17px;line-height:1.5;letter-spacing:-.4px;margin:0 0 6px}
.teaser-top p{font-size:13px;color:var(--muted);margin:0}
.teaser-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.teaser-meta span{font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:var(--navy)}
.teaser details{border-top:1px solid var(--line)}
.teaser summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:13px;font-weight:800;color:var(--navy);text-align:center}
.teaser summary::-webkit-details-marker{display:none}
.teaser summary:after{content:' ＋'}
.teaser details[open] summary:after{content:' −'}
.teaser .mini{list-style:none;margin:0;padding:0 16px 12px}
.teaser .mini li{padding:9px 0;border-top:1px solid #e8edf4;font-size:13px;line-height:1.55}
.teaser .mini time{display:block;font-size:11px;font-weight:800;color:var(--blue)}
.teaser .mini span{display:block;font-size:11px;color:var(--muted)}
.teaser .gift-line{margin:0 16px 14px;font-size:12px;color:#6b4d0a;background:#fff6dc;border-radius:9px;padding:9px 11px}
.primary,.secondary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:14px 16px;border-radius:12px;font-weight:800;text-decoration:none;text-align:center;border:1px solid transparent;line-height:1.45}
.primary{background:var(--gold);color:var(--navy);box-shadow:0 4px 0 #c38f13}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #c38f13}
.secondary{background:#f5f7fa;color:var(--ink);border-color:var(--line);margin-top:10px;font-size:14px;min-height:48px}
.navy-btn{background:var(--navy);color:#fff;box-shadow:0 4px 0 #050e1c}
.helper{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 0}
.steps{display:flex;gap:6px;margin:0 0 20px}
.steps span{flex:1;height:6px;border-radius:6px;background:#e6ecf3}
.steps .ok{background:var(--ok)}.steps .no{background:var(--no)}.steps .cur{background:var(--gold)}
.q-tag{display:inline-block;font-size:11px;font-weight:800;color:var(--blue);background:var(--soft);border-radius:6px;padding:4px 9px;margin-bottom:10px}
.q-icon{font-size:40px;line-height:1.2;margin:2px 0 6px}
.q-title{font-size:clamp(21px,5.6vw,25px);line-height:1.45;letter-spacing:-.7px;margin:0 0 6px}
.q-hint{font-size:13px;color:var(--muted);margin:0}
.answers{display:grid;gap:10px;margin:20px 0 0}
.answer{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:15px 14px;font-size:15px;font-weight:700;color:var(--ink);transition:border-color .15s,background .15s,transform .15s}
.answer:not(:disabled):hover{border-color:#7ba2e5;background:var(--soft);transform:translateX(3px)}
.answer:disabled{cursor:default}
.letter{display:grid;place-items:center;min-width:30px;height:30px;border-radius:8px;background:var(--soft);color:var(--blue);font-size:13px;font-weight:900;flex:none}
.answer.correct{border-color:var(--ok);background:var(--okbg)}
.answer.correct .letter{background:var(--ok);color:#fff}
.answer.wrong{border-color:var(--no);background:var(--nobg)}
.answer.wrong .letter{background:var(--no);color:#fff}
.answer.dim{opacity:.45}
.reveal{margin-top:16px;border-radius:14px;padding:16px 16px 14px;animation:rise .25s ease-out}
.reveal.ok{background:var(--okbg);border:1px solid #bfe6cf}
.reveal.no{background:#fff7ec;border:1px solid #f1d9ad}
.reveal strong{display:block;font-size:16px;margin-bottom:4px}
.reveal.ok strong{color:var(--ok)}.reveal.no strong{color:#a3561c}
.reveal p{font-size:14px;margin:0 0 12px;color:#33465f}
.fact{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 11px;margin-bottom:12px}
.fact:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.score-hero{background:linear-gradient(135deg,#14305a,var(--navy2));color:#fff;text-align:center;padding:28px 22px 26px}
.score-hero.perfect{background:linear-gradient(135deg,#f9c949,#f0a91d);color:var(--navy)}
.stars{font-size:30px;letter-spacing:6px;color:var(--gold);margin:4px 0 6px;animation:pop .5s ease-out}
.perfect .stars{color:var(--navy)}
.score-num{font-size:46px;font-weight:900;line-height:1.1;margin:0}
.score-num small{font-size:20px;opacity:.75}
.score-hero h1{font-size:25px;line-height:1.4;letter-spacing:-.7px;margin:10px 0 6px}
.score-hero p{font-size:14px;margin:0;color:#c5d3e7}
.perfect p{color:#4a3508}
.perfect .eyebrow{color:var(--navy)}
.badge-time{display:inline-block;margin-top:12px;font-size:11px;font-weight:800;background:#ffffff1c;border-radius:20px;padding:4px 11px}
.perfect .badge-time{background:#10254418}
.box{border-radius:16px;padding:18px;margin:0 0 16px}
.box h3{font-size:17px;line-height:1.45;letter-spacing:-.4px;margin:0 0 8px}
.box p{font-size:13px;margin:0}
.box .label{font-size:11px;font-weight:900;letter-spacing:.6px;margin:0 0 6px}
.box.bonus{background:#fff6dc;border:1.5px solid var(--gold)}
.box.bonus .label{color:#9a6b00}
.box.pen{background:#f5f8fd;border:1px solid var(--line)}
.box.pen .label{color:var(--blue)}
.recap{list-style:none;padding:0;margin:0}
.recap li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #edf1f6;font-size:14px}
.recap li:first-child{border-top:0}
.recap .mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;background:var(--ok);margin-top:1px}
.recap .mk.x{background:#b9c4d2}
.recap b{color:var(--navy)}
.section-title{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--muted);margin:22px 0 10px}
.seminar{background:var(--navy);color:#fff;border-radius:18px;padding:22px 18px;margin:6px 0 16px}
.seminar .eyebrow{margin-bottom:6px}
.seminar h2{font-size:22px;line-height:1.4;letter-spacing:-.6px;margin:0 0 8px}
.seminar .when{font-size:13px;color:#c9d7e9;margin:0 0 4px}
.agenda{list-style:none;padding:0;margin:14px 0 0}
.agenda li{padding:12px 0;border-top:1px solid #ffffff1f}
.agenda time{display:block;font-size:12px;font-weight:800;color:var(--gold)}
.agenda strong{display:block;font-size:14px;line-height:1.55;margin:2px 0}
.agenda span{font-size:12px;color:#aebfd6}
.travel{background:#ffffff10;border:1px dashed #ffffff40;border-radius:13px;padding:14px;margin-top:14px}
.travel b{color:var(--gold)}
.travel p{font-size:13px;color:#dce7f7;margin:4px 0 0}
.cal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.cal a{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:66px;border-radius:12px;text-decoration:none;font-weight:800;font-size:14px;padding:10px 8px;line-height:1.4}
.cal a small{font-size:11px;font-weight:500;opacity:.8;margin-top:3px}
.cal .g{background:var(--gold);color:var(--navy)}
.cal .i{background:#fff;color:var(--navy)}
.cal-note{font-size:11px;color:#aebfd6;margin:10px 0 0;line-height:1.7}
.portal{display:flex;justify-content:center;margin-top:14px}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:18px;line-height:1.8}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-12px;width:8px;height:13px;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7);opacity:.3}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.screen{animation:rise .22s ease-out}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.lv{font-size:11px;font-weight:900;letter-spacing:.8px;color:#fff;background:var(--navy);border-radius:6px;padding:4px 9px}
.combo{font-size:12px;font-weight:900;color:#c25a12;opacity:0;transition:opacity .2s}
.combo.on{opacity:1;animation:pop .35s ease-out}
.timer{height:9px;background:#e6ecf3;border-radius:9px;overflow:hidden;margin:14px 0 0}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#16834f,var(--gold) 55%,#e0662a);transform-origin:left;will-change:transform}
.timer-label{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted);margin-top:5px}
.road{position:relative;margin:16px -8px 0;background:#2b3446;border-radius:16px;padding:6px 0;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.road:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 26px,#ffffff08 26px 52px);animation:roadmove 1s linear infinite;pointer-events:none}
.lane{position:relative;height:80px;border-bottom:2px dashed #ffffff33}
.lane:last-child{border-bottom:0}
.car{position:absolute;top:10px;left:0;height:58px;max-width:64%;min-width:120px;display:flex;align-items:center;gap:8px;padding:0 16px 0 10px;border:0;border-radius:14px 26px 26px 14px;background:#fff;color:var(--ink);font-weight:800;font-size:13.5px;line-height:1.3;text-align:left;box-shadow:0 5px 0 #00000055;will-change:transform;cursor:pointer;touch-action:manipulation}
.car:before,.car:after{content:"";position:absolute;bottom:-7px;width:15px;height:15px;border-radius:50%;background:#111a28;border:3px solid #9aa7b8}
.car:before{left:16px}.car:after{right:20px}
.car .letter{min-width:28px;height:28px}
.lane:nth-child(1) .car{background:#ffd56b}
.lane:nth-child(2) .car{background:#ffffff}
.lane:nth-child(3) .car{background:#bcd5ff}
.car.correct{background:#2fbf71!important;color:#fff}
.car.correct .letter{background:#fff;color:var(--ok)}
.car.wrong{background:#ff8a73!important;color:#fff;animation:shake .4s}
.car.wrong .letter{background:#fff;color:var(--no)}
.car.dim{opacity:.35}
.road.stopped:before{animation:none}
.pts{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 #0006;pointer-events:none;animation:ptsup 1s ease-out forwards;white-space:nowrap}
.pts.miss{color:#ff8a73}
.countdown{display:grid;place-items:center;min-height:420px;background:linear-gradient(135deg,#14305a,var(--navy2));color:#fff;text-align:center}
.countdown .n{font-size:110px;font-weight:900;line-height:1;color:var(--gold);animation:pop .6s ease-out}
.countdown p{color:#c5d3e7;font-size:14px;margin:14px 0 0}
.lights{display:flex;gap:12px;justify-content:center;margin-bottom:22px}
.lights i{width:26px;height:26px;border-radius:50%;background:#33405a;border:3px solid #0b1424}
.lights i.on{background:#e8463a;box-shadow:0 0 14px #e8463a}
.lights.go i{background:#2fbf71;box-shadow:0 0 14px #2fbf71}
.rank{display:inline-block;font-size:13px;font-weight:900;background:#ffffff1c;border-radius:8px;padding:5px 12px;margin-top:8px}
.perfect .rank{background:#10254418}
.score-pts{font-size:15px;font-weight:800;margin:6px 0 0;opacity:.9}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}
.how div{background:#f5f8fd;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.45}
.how b{display:block;font-size:20px;line-height:1.2;margin-bottom:3px}
@keyframes shake{20%,60%{transform:translateX(var(--x,0px)) translateX(-6px)}40%,80%{transform:translateX(var(--x,0px)) translateX(6px)}}
@keyframes ptsup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
@keyframes roadmove{to{background-position:52px 0}}
.card{position:relative}
.hud-wrap{display:flex;align-items:center;gap:6px}
.snd{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:15px;line-height:1;padding:0}
.speedo{font-size:12px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.speedo b{color:#e0662a}
.timer.urgent i{background:#e8463a!important;animation:blink .5s steps(2) infinite}
.timer-label.urgent{color:#e8463a}
.timer-label.urgent #sec{animation:pop .5s ease-out infinite}
.road.go:before{animation-duration:var(--roadDur,1s)}
.road .flash{position:absolute;inset:0;pointer-events:none;animation:flash .45s ease-out forwards}
.road .flash.g{background:#2fbf7166}.road .flash.r{background:#e8463a66}
.card.shake{animation:cardshake .4s}
.lap{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#0b1c34e6;color:#fff;text-align:center;animation:lapin 1.05s ease-in-out forwards;pointer-events:none}
.lap .big{font-size:52px;font-weight:900;letter-spacing:-1px;line-height:1.1;font-style:italic}
.lap .big.final{color:var(--gold)}
.lap .sub{display:inline-block;margin-top:10px;font-size:14px;font-weight:900;letter-spacing:1px;background:#e0662a;border-radius:6px;padding:4px 12px}
.lap .stripe{position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,#fff 0 14px,#111 14px 28px);opacity:.85}
.lap .stripe.t{top:22%}.lap .stripe.b{bottom:22%}
.rating{display:inline-block;font-size:13px;font-weight:900;font-style:italic;color:#fff;background:#e0662a;border-radius:6px;padding:2px 9px;margin-left:6px;vertical-align:2px}
.car.boost{filter:drop-shadow(-10px 0 0 #ffffff55)}
@keyframes blink{50%{opacity:.35}}
@keyframes flash{from{opacity:1}to{opacity:0}}
@keyframes cardshake{15%,55%{transform:translateX(-7px)}35%,75%{transform:translateX(7px)}}
@keyframes lapin{0%{opacity:0;transform:scale(1.15)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.96)}}
.quests{border:1.5px solid var(--navy);border-radius:16px;padding:14px 14px 6px;margin:0 0 16px;background:#fff}
.quests h3{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin:0 0 8px;letter-spacing:-.3px}
.quests h3 small{font-size:11px;font-weight:800;color:var(--muted)}
.quest{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #edf1f6}
.quest:first-of-type{border-top:0}
.quest .qi{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:#eef2f7;filter:grayscale(1);opacity:.6}
.quest b{display:block;font-size:14px;line-height:1.4}
.quest span{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.quest em{margin-left:auto;flex:none;font-style:normal;font-size:11px;font-weight:900;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.quest.done .qi{background:var(--gold);filter:none;opacity:1;animation:pop .45s ease-out}
.quest.done em{color:#fff;background:var(--ok);border-color:var(--ok)}
.allclear{background:linear-gradient(135deg,#102544,#1756c5);color:#fff;text-align:center;border-radius:14px;padding:14px;margin:0 0 14px;font-weight:900;font-size:16px;animation:pop .5s ease-out}
.allclear small{display:block;font-size:12px;font-weight:500;color:#d6e2f5;margin-top:3px}
.toast{position:fixed;left:50%;top:14px;z-index:60;transform:translateX(-50%);background:var(--navy);color:#fff;border:2px solid var(--gold);border-radius:14px;padding:10px 16px;font-size:14px;font-weight:900;box-shadow:0 10px 30px #0005;white-space:nowrap;animation:toast 2.2s ease-in-out forwards}
.toast small{display:block;font-size:11px;font-weight:600;color:var(--gold)}
.road.turbo{background:#3a1d1d}
.lv.bonus{background:#c8452f}
.lap .big.bonus{color:#ff8a73}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.confetti{display:none}}
@media(max-width:370px){.body{padding:20px 16px}.answer{font-size:14px;padding:13px 12px}.gift-strip div{font-size:11px}}
/* ===== 큰 글씨 보정 (게임 도로·차 제외) ===== */
.brand strong{font-size:19px}.brand small{font-size:11px}
.hud{font-size:13px}
.eyebrow{font-size:13px}
.hero p{font-size:16.5px;line-height:1.7}
.how div{font-size:14px;line-height:1.5;padding:12px 6px}.how b{font-size:24px}
.quests h3{font-size:18px}.quests h3 small{font-size:13px}
.quest b{font-size:16.5px}.quest span{font-size:14.5px;line-height:1.5}.quest em{font-size:13px}
.quest .qi{width:44px;height:44px;font-size:23px}
.primary{font-size:18px;min-height:58px}
.secondary{font-size:16px;min-height:52px}
.helper{font-size:14.5px;line-height:1.6}

function audio(){
  if(muted) return null;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
  }catch(e){ return null; }
  return actx;
}
function tone(freq, dur, type='square', vol=0.06, when=0, slideTo=null){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}

  combo(){ tone(1568,.12,'triangle',.07,.22); },

  tick(){ tone(1200,.05,'square',.04); },

};

function renderQuestion(){
  stopLoop();
  const q = curQ(), bonus = isBonus(), T = curTime();
  answered = false;
  updateHud();
  app.innerHTML = `
  <div class="screen body">
    <div class="steps" aria-label="${quiz.length}라운드 중 ${step+1}번째">
      ${quiz.map((_,i)=>`<span class="${i<step?(results[i]?'ok':'no'):i===step?'cur':''}"></span>`).join('')}
    </div>
    <div class="game-top">
      <span class="lv ${bonus?'bonus':''}">${bonus ? q.tag : `ROUND ${step+1} · ${q.tag}`}</span>
      <span class="speedo">🏎️ <b>${bonus ? 400 : 120 + step*40}</b> km/h</span>
    </div>
    <h2 class="q-title"><span aria-hidden="true">${q.icon}</span> ${q.title}</h2>
    <p class="q-hint">💡 ${q.hint}</p>
    <div class="timer" id="timer" aria-hidden="true"><i id="bar"></i></div>
    <div class="timer-label" id="tlabel"><span>⏱️ 남은 시간 <span class="combo ${combo>=2?'on':''}" id="combo">🔥 ${combo} COMBO</span></span><span id="sec">${T}초</span></div>
    <div class="road ${bonus?'turbo':''}" id="road">
      ${orders[step].map((oi,n)=>`<div class="lane"><button class="car" data-i="${oi}">
        <span class="letter">${'ABC'[n]}</span><span>${q.options[oi]}</span></button></div>`).join('')}
    </div>
    <div id="reveal"></div>
  </div>`;
  const road = document.getElementById('road');
  cars = [...road.querySelectorAll('.car')].map(el => {
    const laneW = el.parentElement.clientWidth;
    const maxX = Math.max(0, laneW - el.offsetWidth - 8);
    const sp = reduceMotion ? 0 : (q.speed || SPEEDS[step]) * (0.8 + Math.random()*0.5);
    const c = {el, x: reduceMotion ? 4 : 4 + Math.random()*maxX, v: sp * (Math.random()<.5?-1:1), base: sp, maxX: maxX + 4, ph: Math.random()*6, next: 0, boostUntil: 0};
    el.style.transform = `translateX(${c.x}px)`;
    const pick = e => { if(e.type==='pointerdown') e.preventDefault(); choose(el); };
    el.addEventListener('pointerdown', pick);
    el.addEventListener('click', e => { if(e.detail === 0) choose(el); }); // 키보드(Enter/Space)
    return c;
  });
  road.style.setProperty('--roadDur', bonus ? '.25s' : (1 - step*0.16) + 's');
  const bar = document.getElementById('bar'), sec = document.getElementById('sec');
  const timerEl = document.getElementById('timer'), tlabel = document.getElementById('tlabel');
  const burst = step >= 1 && !reduceMotion;   // 2라운드부터 돌발 가속·방향 전환
  let last = 0; lastTick = -1;
  const loop = now => {
    if(!last){ last = now; qStart = now; cars.forEach(c => c.next = now + 600 + Math.random()*1400); }
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const left = Math.max(0, T - (now - qStart) / 1000);
    bar.style.transform = `scaleX(${left / T})`;
    sec.textContent = Math.ceil(left) + '초';
    if(left <= Math.min(5, T/2)){
      timerEl.classList.add('urgent'); tlabel.classList.add('urgent');
      const sNow = Math.ceil(left);
      if(sNow !== lastTick && sNow > 0){ lastTick = sNow; sfx.tick(); }
    }
    for(const c of cars){
      if(burst && now > c.next){
        if(Math.random() < .5){ c.v = -c.v; }
        else { c.boostUntil = now + 450; c.el.classList.add('boost'); }
        c.next = now + (bonus ? 350 + Math.random()*500 : 900 + Math.random() * (2200 - step*250));
      }
      if(c.boostUntil && now > c.boostUntil){ c.boostUntil = 0; c.el.classList.remove('boost'); }
      const mult = c.boostUntil ? 2.1 : 1;
      c.x += c.v * mult * dt;
      if(c.x < 4){ c.x = 4; c.v = Math.abs(c.v); }
      if(c.x > c.maxX){ c.x = c.maxX; c.v = -Math.abs(c.v); }
      const bob = reduceMotion ? 0 : Math.sin(now/180 + c.ph) * 1.5;
      c.el.style.setProperty('--x', c.x + 'px');
      c.el.style.transform = `translateX(${c.x}px) translateY(${bob}px)`;
    }
    if(left <= 0){ choose(null); return; }
    raf = requestAnimationFrame(loop);
  };
  // 라운드 인트로 배너 → 출발
  const final = step === quiz.length - 1;
  if(reduceMotion){ raf = requestAnimationFrame(loop); return; }
  const lap = document.createElement('div');
  lap.className = 'lap';
  const big = bonus ? 'BONUS STAGE' : final ? 'FINAL LAP' : 'ROUND '+(step+1);
  const sub = bonus ? '🎯 초고속 터보! 6초 안에 명중' : final ? '🏁 마지막 라운드!' : step===0 ? 'READY · GO!' : 'SPEED UP ▲';
  lap.innerHTML = `<span class="stripe t"></span><div><div class="big ${bonus?'bonus':final?'final':''}">${big}</div>
    <span class="sub">${sub}</span></div><span class="stripe b"></span>`;
  app.appendChild(lap);
  sfx.lap(final);
  lapTimer = setTimeout(() => { lap.remove(); road.classList.add('go'); raf = requestAnimationFrame(loop); }, 1000);
}

}

function choose(btn){
  if(answered || !raf) return;   // 라운드 인트로 중에는 선택 불가
  answered = true;
  stopLoop();
  document.getElementById('road').classList.add('stopped');
  const q = curQ(), bonus = isBonus(), T = curTime();
  const timeout = btn === null;
  const ok = !timeout && Number(btn.dataset.i) === q.correct;
  if(bonus) bonusOk = ok; else results[step] = ok;
  const elapsed = (performance.now() - qStart) / 1000;
  const left = Math.max(0, T - elapsed);
  document.getElementById('timer').classList.remove('urgent');
  const fl = document.createElement('div'); fl.className = 'flash ' + (ok?'g':'r');
  document.getElementById('road').appendChild(fl);
  const rating = left/T > .7 ? '⚡ PERFECT' : left/T > .4 ? 'GREAT' : 'GOOD';
  let gain = 0;
  if(ok){
    if(bonus){ gain = 300 + Math.round(left / T * 100); }
    else { combo++; gain = 100 + Math.round(left / T * 100) + (combo >= 2 ? 50 * (combo - 1) : 0); }
    points += gain;
    floatPts(`+${gain}` + (!bonus && combo >= 2 ? ` 🔥x${combo}` : ''));
    sfx.ok(); if(!bonus && combo >= 2) sfx.combo(); vib(40);
    if(!bonus && elapsed <= 2) unlock('flash');
    if(!bonus && combo === quiz.length) setTimeout(() => unlock('combo'), quests.flash ? 0 : 0);
    if(bonus) unlock('sniper');
    if(points >= LEGEND_SCORE) setTimeout(() => unlock('legend'), 900);
  } else {
    if(!bonus) combo = 0;
    floatPts(timeout ? 'TIME OVER' : 'MISS', true);
    sfx.bad(); vib([90,50,90]);
    if(!reduceMotion){ app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake'); }
  }
  for(const c of cars){
    const i = Number(c.el.dataset.i);
    c.el.disabled = true;
    if(i === q.correct) c.el.classList.add('correct');
    else if(c.el === btn) c.el.classList.add('wrong');
    else c.el.classList.add('dim');
  }
  updateHud();
  const cb = document.getElementById('combo');
  cb.textContent = `🔥 ${combo} COMBO`; cb.classList.toggle('on', combo >= 2);
  const last = bonus;
  const nextLabel = bonus ? '🏁 결과 보기' : step === quiz.length - 1 ? '🎯 보너스 스테이지 도전!' : '다음 라운드 →';
  document.getElementById('reveal').innerHTML = `
    <div class="reveal ${ok?'ok':'no'}">
      <strong>${ok ? `⭕ ${bonus?'명중':'정답'}! +${gain}점<span class="rating">${rating}</span>` : timeout ? '⏱️ 시간 초과!' : '❌ 아쉬워요!'}</strong>
      <span class="fact">${q.fact}</span>
      <p>${ok?q.yes:q.no}</p>
      <button class="primary navy-btn" id="next">${nextLabel}</button>
    </div>`;
  const next = document.getElementById('next');
  next.onclick = () => { step++; render(); };
  next.focus({preventScroll:true});
  setTimeout(() => next.scrollIntoView({block:'nearest',behavior:'smooth'}), 250);
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div');
  box.className = 'confetti';
  const colors = ['#f4b82e','#1756c5','#16834f','#ffffff','#102544'];
  for(let i=0;i<60;i++){
    const c = document.createElement('i');
    c.style.left = Math.random()*100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random()*0.6) + 's';
    c.style.animationDuration = (1.8 + Math.random()*1.2) + 's';
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3500);
}

function renderResult(){
  const s = score(), total = quiz.length, perfect = s === total;
  if(!finishedAt) finishedAt = new Date();
  const t = finishedAt;
  const stamp = `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  stopLoop();
  hud.textContent = `FINISH · ${points}점`;
  const msg = perfect ? '완벽해요! 태성에스엔이 찐팬 인증!'
    : s >= 3 ? '거의 다 왔어요! 이제 태성에스엔이를 꽤 아시네요.'
    : '이제 태성에스엔이와 친해질 시간이에요!';
  const rank = points >= LEGEND_SCORE ? '🏆 레전드 드라이버'
    : points >= LEGEND_SCORE * 0.7 ? '🏎️ 베테랑 드라이버'
    : points >= LEGEND_SCORE * 0.35 ? '🚗 루키 드라이버'
    : '🔰 초보 드라이버';
  if(points >= LEGEND_SCORE) quests.legend = true;
  const qDone = QUESTS.filter(q => quests[q.id]).length, allClear = qDone === QUESTS.length;
  app.innerHTML = `
  <div class="screen">
    <section class="score-hero ${perfect?'perfect':''}">
      <p class="eyebrow">${perfect?'🏆 PERFECT SCORE':'QUIZ COMPLETE'}</p>
      <div class="stars" aria-hidden="true">${'★'.repeat(s)}${'☆'.repeat(total-s)}</div>
      <p class="score-num">${s}<small> / ${total}</small></p>
      <p class="score-pts">🏁 ${points}점</p>
      <span class="rank">${rank}</span>
      <h1>${msg}</h1>
      <span class="badge-time">참여 완료 · ${stamp}</span>
    </section>
    <div class="body">
      <div class="box bonus">
        <p class="label">🎁 참여 선물</p>
        <h3>이 화면을 태성에스엔이 부스에 보여주세요!</h3>
        <p>퀴즈에 참여해주신 모든 분께 선물을 드립니다.</p>
      </div>
      ${allClear ? `<div class="allclear">🎮 ALL CLEAR! 퀘스트 4개 완전 정복<small>당신은 진정한 태성에스엔이 마스터입니다</small></div>` : ''}
      <section class="quests" aria-label="도전 퀘스트 결과">
        <h3>🎮 도전 퀘스트 <small>${qDone} / ${QUESTS.length} 달성</small></h3>
        ${QUESTS.map(q=>`<div class="quest ${quests[q.id]?'done':''}"><span class="qi" aria-hidden="true">${q.icon}</span><div><b>${q.name}</b><span>${q.desc}</span></div><em>${quests[q.id]?'CLEAR':'도전'}</em></div>`).join('')}
      </section>
      ${allClear ? '' : `<button class="secondary" id="retry" style="margin:-4px 0 16px">↻ 남은 퀘스트 다시 도전</button>`}

      <p class="section-title">오늘 기억할 태성에스엔이 ${quiz.length}가지</p>
      <ul class="recap">
        ${quiz.map((q,i)=>`<li><span class="mk ${results[i]?'':'x'}">${results[i]?'✓':'·'}</span><span><b>${q.fact}</b></span></li>`).join('')}
      </ul>

      <p class="section-title">CAE의 다음 단계, 세미나에서 만나요</p>
      ${seminarSection()}

      <button class="secondary" id="restart">처음 화면으로</button>
    </div>
  </div>`;
  const retry = document.getElementById('retry');
  if(retry) retry.onclick = startRace;
  document.getElementById('restart').onclick = () => { step = -1; results = []; finishedAt = null; render(); };
  if(perfect || allClear) confetti();
  sfx.finish();
  const sp = app.querySelector('.score-pts');
  if(sp && !reduceMotion){
    const t0 = performance.now();
    const up = now => { const k = Math.min(1,(now-t0)/1100); sp.textContent = '🏁 ' + Math.round(points * (1-Math.pow(1-k,3))) + '점'; if(k<1) requestAnimationFrame(up); };
    requestAnimationFrame(up);
  }
}

function render(){
  if(step < 0) renderStart();
  else if(step <= quiz.length) renderQuestion();
  else renderResult();
  focusTop();
}

renderStart();
</script>
</body>
</html>
